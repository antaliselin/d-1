。","我喊他。他停了一下，慢慢转过头——那张脸冲我咧开，嘴角一直裂到耳后。","他笑了。我后来无数次梦见那个笑。","紧接着，多丽丝的早餐店传来尖叫，玻璃碎了，三个人影从巷子里跌出来，扑向街上的活人。","我脑子里只剩一个念头：门。"],action:{id:"begin",label:"把卷帘门砸下去"}},{id:"plot:intro:2",title:"合伙人",lines:["埃迪从后屋冲出来，手里还抓着一把刚拆封的扫帚。他是我的合伙人，也是这间店另一个把全部积蓄押进来的人。","「关门！」他吼道，扫帚一扔，和我一起抓住卷帘门的拉带。","门落到底，第一声撞击几乎同时砸上来。铁皮凹进去一块，灰尘从门缝里簌簌往下掉。","埃迪顶着门，牙关咬得发紧：「货架。把货架推过来。」"],action:{id:"seal",label:"和埃迪一起把货架推过去"}},{id:"plot:intro:3",title:"最危险的几天",lines:["三排货架横在门前，后门用木条和钉子封死。我们用胶带把窗户贴成蛛网，只留一条缝看外面。","第一天，撞击没有停。第二天，窗玻璃裂了。第三天，我们连灯都不敢开。","冰柜停了，汽水变温，货架上的饼干被我们按天数分好。","埃迪在收银台下面翻出一本送货员的记事本。前面是路线和签收，最后一页只有两行铅笔字：「第四天。痒，好吃。」","他盯着那行字看了很久，然后合上本子，塞进货架最里面。","第七天清晨，外面第一次彻底安静。"],action:{id:"listen",label:"贴着门听外面的动静"}},{id:"plot:intro:4",title:"把店变成堡垒",lines:["我把耳朵贴在铁皮上。风从门缝里钻进来，远处偶尔响一枪，除此之外什么都没有。","没有人来救我们。广播里那句「待在家里」循环了三天，然后连电台也断了。","雪松街从一条街变成了一个孤岛。我们决定把这家店修成一座堡垒。","拆货架、起钉子、把木板一层层钉上窗。空罐头穿上铁丝，挂在后巷的矮墙上，谁踩过去都会响。","埃迪用两箱汽水，从一个开皮卡路过的男人手里换来一卷铁丝网。","最后一颗钉子敲进去时，我手上全是木刺，但心里第一次踏实。"],action:{id:"fortify",label:"把最后一块木板钉死"}},{id:"plot:intro:5",title:"清街",lines:["躲着不是办法。那些东西会循着声音聚过来，今天在街尾，明天就可能堵到门口。","我们挑了个出太阳的早上，把门打开一条缝，第一次走出去。埃迪拿撬棍，我端着一支从仓库角落翻出来的旧霰弹枪。","先是对面的加油站，然后是巷子、公交站、学校围墙。我们把尸体拖到空地上烧掉，用路障封住街口，一扇门一扇门地钉死。","半个月后，雪松街上还能站起来的东西，已经数得过来了。"],action:{id:"barricade",label:"把路障推到街口"}},{id:"plot:intro:6",title:"末世小卖部",lines:["路障立起来那天，街角药店的克莱恩太太探出头，问我们还有没有瓶装水。","后来是抱着孩子的年轻母亲，再后来是一个断了腿的男人。雪松街上重新有了脚步声。","埃迪把最后一箱罐头搬上货架，拍了拍手上的灰：「还开吗？」","「开。」我说，「外面越乱，越有人需要一间能买到东西的店。」","我们分了工：柜台归我，出门搜刮归他。他不懂怎么跟客人讨价还价，我也不放心把他留在收银台后面。","今天，雪松街的这家店，在末世里正式开张。"],action:{id:"reopen",label:"把卷帘门重新拉开"}}];var ve=[{id:"survivor-duyan",name:"独眼",look:"goggles",palette:{skin:"#c98f63",coat:"#3f4a3a",accent:"#9aa27a"},trait:"眼神毒，捡东西手快"},{id:"survivor-laok",name:"老K",look:"cap",palette:{skin:"#b07b52",coat:"#4a3b2c",accent:"#c0a06a"},trait:"以前跑运输的，认路"},{id:"survivor-xiaoman",name:"小满",look:"scarf",palette:{skin:"#d3a074",coat:"#5a3f4a",accent:"#c98f9f"},trait:"个子小，钻得进缝"}];var jt=["什么时候出发？我准备好了。","说吧，这趟要什么。","预算给够，我跑得远一点。"];var oo=[{id:"child",title:"门外的孩子",weight:1       <div class="bubble" id="bubble">

        <span class="bubble-skip" id="bubble-skip">轻点跳过</span>

  <div class="rack-list" id="rack-list"></div>
</aside>

</footer>

<div class="toast" id="toast" aria-live="polite"></div>
